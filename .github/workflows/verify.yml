name: Offline verification
on: [push, pull_request]
jobs:
  fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      # Uses sanitized fixtures only. Never uploads correspondence or review files.
      - run: python -m property_timeline.verify --strict
